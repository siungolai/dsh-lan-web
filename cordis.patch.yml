# dsh-lan-web bundle patch
# 1) LAN binding: override the web-app bundle's webserver row.
#    NOTE: this is a WHOLE-config replacement — every key of the row must be
#    restated (host + port). Applied in bundle order: the last writer wins.
- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080

# 2) Mount the plugin code row. inject: [webServer] waits for the webserver
#    service. Do NOT insert any row id already used by another bundle
#    (duplicate loader entry id -> startup failure).
- insert:
    - id: dsh-lan-web
      name: 'dsh-lan-web'
      inject: [webServer]
